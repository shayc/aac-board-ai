<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>AAC Board AI</title>
    <meta
      name="description"
      content="AAC Board AI helps people who cannot rely on speech communicate naturally with Built-in AI — proofreading, rephrasing, and translating safely on their device."
    />

    <meta name="color-scheme" content="light dark" />

    <style>
      html.light {
        color-scheme: light;
      }
      html.dark {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: light-dark(__SHELL_LIGHT__, __SHELL_DARK__);
      }
      #root {
        height: 100svh;
        background-color: light-dark(__CONTENT_LIGHT__, __CONTENT_DARK__);
      }
    </style>

    <!-- Set the theme class before first paint so MUI adopts it without a flash. -->
    <script>
      {
        const mode = localStorage.getItem("mui-mode") ?? "system";
        const isDark =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : mode === "dark";
        document.documentElement.classList.add(isDark ? "dark" : "light");
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/board.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
